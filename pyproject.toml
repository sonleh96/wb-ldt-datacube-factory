[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-ldt-datacube-factory"
version = "0.1.0"
description = "Config-driven modular extraction and processing for the WB LDT datacube"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.35",
  "PyYAML>=6.0",
  "requests>=2.31",
  "urllib3>=2.0",
]

[project.optional-dependencies]
geo = [
  "dask[array]>=2024.7",
  "earthengine-api>=0.1.417",
  "geemap>=0.35",
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "netCDF4>=1.7",
  "numba>=0.60",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyogrio>=0.10",
  "pyquadkey2>=0.3",
  "rasterio>=1.3",
  "rasterstats>=0.19",
  "rioxarray>=0.17",
  "shapely>=2.0",
  "xarray>=2024.7",
]
dev = ["pytest>=8"]

[project.scripts]
ldt-factory = "ldt_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
