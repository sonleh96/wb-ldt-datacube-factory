name: Cross-platform CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements-install:
    name: requirements (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: windows-x64
            runner: windows-2022
          - name: macos-intel
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Create ldt-factory environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ldt-factory
          environment-file: environment.yml
          miniforge-version: latest
          conda-remove-defaults: "true"
          auto-activate-base: false
          channel-priority: strict
      - name: Install documented requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify CLI and portable configuration
        env:
          LDT_DATA_ROOT: ${{ runner.temp }}/ldt-data
        run: |
          ldt-factory --help
          ldt-factory plan --config config/countries/rou.yaml --json
      - name: Report native package versions
        run: |
          conda list
          python -c "import llvmlite, numba, numpy, pyarrow; print('native versions:', llvmlite.__version__, numba.__version__, numpy.__version__, pyarrow.__version__)"
      - name: Run tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -X faulthandler -m pytest -vv

  locked-install:
    name: universal lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lock tool
        run: python -m pip install "uv==0.11.26"
      - name: Verify and install lock
        run: |
          uv lock --check
          uv sync --locked --all-extras
      - name: Verify locked environment
        run: |
          uv run ldt-factory --help
          uv run python -m pytest
